name: PR

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update MoonBit registry
        run: |
          for attempt in 1 2 3; do
            if moon update; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Test generator
        run: moon -C testgen test --target wasm

      - name: Test shell-free executor
        run: python -m unittest discover -s scripts/tests -v

      - name: Verify generated baselines
        run: |
          scripts/update-tests.sh
          git add --all -- tests/unix
          git diff --cached --exit-code HEAD -- tests/unix

      - name: Run Unix baselines
        run: |
          mapfile -t baseline_paths < .daily-test/unix-baseline-paths.txt
          moonx moonbit-community/mooncram@0.1.0 test "${baseline_paths[@]}"

  windows-baseline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install MoonBit
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Update MoonBit registry
        shell: pwsh
        run: |
          foreach ($attempt in 1, 2, 3) {
            moon update
            if ($LASTEXITCODE -eq 0) {
              break
            }
            if ($attempt -eq 3) {
              exit 1
            }
            Start-Sleep -Seconds ($attempt * 10)
          }

      - name: Test shell-free executor
        shell: pwsh
        run: python -m unittest discover -s scripts/tests -v

      - name: Verify generated Windows baselines
        shell: pwsh
        run: |
          .\scripts\update-windows-tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -c core.safecrlf=false add --all -- tests/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --cached --exit-code HEAD -- tests/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Windows baselines
        shell: pwsh
        run: |
          $baselinePaths = @(Get-Content .daily-test/windows-baseline-paths.txt)
          if ($baselinePaths.Count -eq 0) {
            Write-Host "No compatible Windows fixture baselines."
            exit 0
          }
          moonx moonbit-community/mooncram@0.1.0 test @baselinePaths
