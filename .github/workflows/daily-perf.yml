name: Daily IDE Performance

on:
  schedule:
    - cron: "0 10 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

concurrency:
  group: daily-perf-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  Unix-Perf:
    name: Unix-Perf
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install MoonBit
        env:
          MOONBIT_INSTALL_DEV: "1"
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Update MoonBit registry
        run: |
          for attempt in 1 2 3; do
            if moon update; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Run Unix performance tests
        run: bash scripts/run-ide-perf.sh
      - name: Upload Unix performance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ide-perf-unix-${{ github.run_id }}-${{ github.run_attempt }}
          path: perf/data/unix/
          retention-days: 90
          if-no-files-found: warn

  Windows-Perf:
    name: Windows-Perf
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install MoonBit
        env:
          MOONBIT_INSTALL_DEV: "1"
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Update MoonBit registry
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          foreach ($attempt in 1, 2, 3) {
            moon update
            if ($LASTEXITCODE -eq 0) {
              break
            }
            if ($attempt -eq 3) {
              exit $LASTEXITCODE
            }
            Start-Sleep -Seconds ($attempt * 10)
          }

      - name: Run Windows performance tests
        run: ./scripts/run-ide-perf.ps1 -Action Test

      - name: Upload Windows performance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ide-perf-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: perf/data/windows/
          retention-days: 90
          if-no-files-found: warn
