name: Daily Test

on:
  schedule:
    - cron: "0 9 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

concurrency:
  group: daily-test-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  BASE_BRANCH: ${{ github.ref_name }}
  BASE_SHA: ${{ github.sha }}
  DAILY_BRANCH: ${{ github.ref_name == 'main' && 'daily-test/update-baselines' || format('daily-test/{0}/update-baselines', github.ref_name) }}

jobs:
  daily-test:
    name: Unix Baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Cancel pending auto-merge before updating daily branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="$(gh pr list \
            --head "$DAILY_BRANCH" \
            --base "$BASE_BRANCH" \
            --state open \
            --json number,autoMergeRequest \
            --jq '.[0] | select(.autoMergeRequest != null) | .number // empty')"
          if [ -n "$pr_number" ]; then
            gh pr merge "$pr_number" --disable-auto
          fi

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Prepare daily branch
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "::error::Run Daily Test on a branch so its pull request has a branch to target."
            exit 1
          fi
          git fetch --no-tags origin "+refs/heads/$DAILY_BRANCH:refs/remotes/origin/$DAILY_BRANCH" || true
          git checkout -B "$DAILY_BRANCH" "$BASE_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .daily-test

      - name: Update testgen dependencies
        run: scripts/update-dependencies.sh

      - name: Commit dependency updates
        run: |
          git add --all -- testgen/moon.mod
          if ! git diff --cached --quiet -- testgen/moon.mod; then
            git commit -m "chore: update daily testgen dependencies"
          fi

      - name: Update MoonBit registry for existing Unix tests
        run: scripts/run-moon-update.sh

      - name: Test generator
        run: moon -C testgen test --target wasm

      - name: Refresh and commit existing Unix snapshots
        run: |
          scripts/run-moon-check.sh --existing
          mapfile -t baseline_paths < .daily-test/unix-existing-baseline-paths.txt
          moonx moonbit-community/mooncram@0.1.0 update "${baseline_paths[@]}" \
            > .daily-test/unix-existing-cram-update.log 2>&1

          git add --all -- tests/unix
          git diff --cached --no-ext-diff --no-color -- tests/unix > .daily-test/unix-existing-snapshots.diff
          if [ -s .daily-test/unix-existing-snapshots.diff ]; then
            git diff --cached --stat -- tests/unix
            git commit -m "chore: refresh existing Unix IDE snapshots"
          fi
          git rev-parse HEAD > .daily-test/unix-existing-head.txt

      - name: Update fixture repos
        run: scripts/update-submodules.sh

      - name: Commit submodule updates
        run: |
          git add --all -- fixtures/repos
          if ! git diff --cached --quiet -- fixtures/repos; then
            git commit -m "chore: update daily fixture submodules"
          fi

      - name: Update MoonBit registry
        run: scripts/run-moon-update.sh

      - name: Regenerate Unix tests and refresh snapshots
        run: |
          scripts/update-tests.sh
          mapfile -t baseline_paths < .daily-test/unix-baseline-paths.txt
          moonx moonbit-community/mooncram@0.1.0 update "${baseline_paths[@]}" \
            > .daily-test/unix-cram-update.log 2>&1

      - name: Run Unix cram tests
        run: |
          mapfile -t baseline_paths < .daily-test/unix-baseline-paths.txt
          set +e
          moonx moonbit-community/mooncram@latest test "${baseline_paths[@]}" \
            > .daily-test/unix-cram-test.log 2>&1
          status=$?
          set -e
          echo "$status" > .daily-test/unix-cram-test-status.txt

      - name: Collect Unix review inputs
        if: always()
        run: |
          mkdir -p .daily-test
          git submodule status --recursive > .daily-test/submodules.txt

      - name: Commit Unix daily changes
        run: |
          git add --all -- tests/unix
          if ! git diff --cached --quiet -- tests/unix; then
            git commit -m "chore: update daily Unix IDE baselines"
          fi

      - name: Push daily branch
        run: git push --force-with-lease origin "$DAILY_BRANCH"

      - name: Upload Unix review inputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-unix-review-inputs
          path: .daily-test
          if-no-files-found: ignore
          include-hidden-files: true

  windows-baseline:
    name: Windows Baselines
    runs-on: windows-latest
    needs: daily-test
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Install MoonBit
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Update MoonBit registry for existing Windows tests
        shell: pwsh
        run: .\scripts\run-moon-update.ps1

      - name: Refresh and commit existing Windows snapshots
        id: existing
        shell: pwsh
        run: |
          .\scripts\run-moon-check.ps1 -Existing
          .\scripts\refresh-windows-snapshots.ps1 -Existing

          git config user.name "github-actions[bot]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git -c core.safecrlf=false add --all -- tests/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -c core.safecrlf=false add --renormalize -- tests/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $diffPath = ".daily-test/windows-existing-snapshots.diff"
          git diff --cached --no-ext-diff --no-color -- tests/windows > $diffPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Item $diffPath).Length -gt 0) {
            git commit -m "chore: refresh existing Windows IDE snapshots"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $sha = git rev-parse HEAD
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "sha=$sha" >> $env:GITHUB_OUTPUT
          }

      - name: Prepare daily branch
        shell: pwsh
        env:
          EXISTING_WINDOWS_SHA: ${{ steps.existing.outputs.sha }}
        run: |
          $refspec = "+refs/heads/$env:DAILY_BRANCH" + ":refs/remotes/origin/$env:DAILY_BRANCH"
          git fetch --no-tags origin $refspec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git checkout -B $env:DAILY_BRANCH "origin/$($env:DAILY_BRANCH)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if ($env:EXISTING_WINDOWS_SHA) {
            git cherry-pick $env:EXISTING_WINDOWS_SHA
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Content .daily-test/windows-existing-head.txt -Value $sha -Encoding ascii -NoNewline

      - name: Update MoonBit registry
        shell: pwsh
        run: .\scripts\run-moon-update.ps1

      - name: Regenerate Windows tests and refresh snapshots
        shell: pwsh
        run: |
          .\scripts\update-windows-tests.ps1
          .\scripts\refresh-windows-snapshots.ps1

      - name: Run Windows cram tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .daily-test | Out-Null
          $baselinePaths = @(Get-Content .daily-test/windows-baseline-paths.txt)
          $status = 0
          if ($baselinePaths.Count -gt 0) {
            moonx moonbit-community/mooncram@latest test @baselinePaths `
              *> .daily-test/windows-cram-test.log
            $status = $LASTEXITCODE
          } else {
            [System.IO.File]::WriteAllText(".daily-test\windows-cram-test.log", "No compatible Windows fixture baselines.`n", [System.Text.Encoding]::ASCII)
          }
          [System.IO.File]::WriteAllText(".daily-test\windows-cram-test-status.txt", [string]$status, [System.Text.Encoding]::ASCII)
          exit 0

      - name: Commit Windows daily changes
        shell: pwsh
        run: |
          # Add removals and new files before renormalizing the remaining index;
          # --renormalize alone tries to stat deleted tracked files and fails.
          git -c core.safecrlf=false add --all -- tests/windows
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          # Stage first: the Windows checkout can report CRLF-only worktree
          # changes that disappear once Git normalizes them into the index.
          git -c core.safecrlf=false add --renormalize -- tests/windows
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          git diff --cached --quiet -- tests/windows
          $diffStatus = $LASTEXITCODE

          if ($diffStatus -eq 1) {
            git commit -m "chore: update daily Windows IDE baselines"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          } elseif ($diffStatus -ne 0) {
            exit $diffStatus
          }
          exit 0

      - name: Push daily branch
        shell: pwsh
        run: git push origin $env:DAILY_BRANCH

      - name: Upload Windows review inputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-windows-review-inputs
          path: .daily-test
          if-no-files-found: ignore
          include-hidden-files: true

  daily-review:
    name: Daily Review
    runs-on: ubuntu-latest
    needs:
      - daily-test
      - windows-baseline
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update MoonBit registry
        run: scripts/run-moon-update.sh

      - name: Checkout daily branch
        run: |
          cp .github/scripts/parse-openseek-result.mbtx "$RUNNER_TEMP/parse-openseek-result.mbtx"
          cp .github/codex/prompts/daily-test-review.md "$RUNNER_TEMP/daily-test-review.md"
          git fetch --no-tags origin "+refs/heads/$DAILY_BRANCH:refs/remotes/origin/$DAILY_BRANCH"
          git checkout -B "$DAILY_BRANCH" "origin/$DAILY_BRANCH"
          git submodule update --init --recursive

      - name: Download Unix review inputs
        uses: actions/download-artifact@v8
        with:
          name: daily-unix-review-inputs
          path: .daily-test

      - name: Download Windows review inputs
        uses: actions/download-artifact@v8
        with:
          name: daily-windows-review-inputs
          path: .daily-test

      - name: Prepare staged review inputs
        id: diff
        run: |
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          if git diff --quiet "$BASE_SHA"...HEAD -- testgen/moon.mod fixtures/repos tests/unix tests/windows; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

          review_dir="$RUNNER_TEMP/daily-test-review"
          mkdir -p "$review_dir"/{existing,regenerated}
          git diff --no-ext-diff --no-color --submodule=log "$BASE_SHA"...HEAD -- fixtures/repos > "$review_dir/regenerated/submodules.diff"
          cp .daily-test/submodules.txt "$review_dir/regenerated/"

          needs_review=false
          shopt -s nullglob
          for platform in unix windows; do
            existing="$review_dir/existing"
            regenerated="$review_dir/regenerated"
            start="$(cat ".daily-test/$platform-existing-head.txt")"
            git merge-base --is-ancestor "$BASE_SHA" "$start"
            git merge-base --is-ancestor "$start" HEAD

            cp ".daily-test/$platform-existing-snapshots.diff" "$existing/$platform.diff"
            git diff --no-ext-diff --no-color "$start" HEAD -- "tests/$platform" > "$regenerated/$platform.diff"
            git apply --stat --allow-empty "$existing/$platform.diff" > "$existing/$platform-stat.txt"
            git diff --stat "$start" HEAD -- "tests/$platform" > "$regenerated/$platform-stat.txt"

            cp .daily-test/"$platform"-existing-{baseline-paths.txt,cram-update.log} \
              .daily-test/"$platform"-existing-check-*.log "$existing/"
            cp .daily-test/"$platform"-{baseline-paths.txt,cram-test-status.txt,cram-test.log,cram-update.log} \
              .daily-test/"$platform"-check-*.log "$regenerated/"

            if [ -s "$existing/$platform.diff" ] || [ -s "$regenerated/$platform.diff" ] || \
               [ "$(cat "$regenerated/$platform-cram-test-status.txt")" != "0" ]; then
              needs_review=true
            fi
          done
          echo "needs_review=$needs_review" >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        id: pr
        if: steps.diff.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="$(gh pr list \
            --head "$DAILY_BRANCH" \
            --base "$BASE_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          body_file="$RUNNER_TEMP/daily-pr-body.txt"
          printf '%s\n\n%s\n%s\n\n%s\n' \
            "This PR was generated by the Daily Test workflow from $BASE_BRANCH ($BASE_SHA)." \
            "It upgrades testgen dependencies, refreshes fixture submodules, regenerates IDE baseline tests with testgen," \
            "and promotes Unix and Windows snapshots only for fixtures that pass moon check on that platform." \
            "Agent review covers the existing snapshot refresh and regenerated baselines separately, with fixture context and execution logs." > "$body_file"

          if [ -z "$pr_number" ]; then
            pr_url="$(gh pr create \
              --base "$BASE_BRANCH" \
              --head "$DAILY_BRANCH" \
              --title "chore: update daily IDE baselines" \
              --body-file "$body_file")"
            pr_number="${pr_url##*/}"
          else
            gh pr edit "$pr_number" \
              --title "chore: update daily IDE baselines" \
              --body-file "$body_file"
          fi

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Review daily output with OpenSeek
        id: openseek
        if: steps.diff.outputs.needs_review == 'true'
        env:
          DEEPSEEK: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK" ]; then
            echo "::error::Set the DEEPSEEK_API_KEY repository secret to a DeepSeek API key."
            exit 1
          fi

          moonx moonbitlang/openseek@latest \
            --model deepseek-flash \
            --thinking high \
            --max-steps 120 \
            run \
            --approval never \
            --no-session \
            --dir "$RUNNER_TEMP/daily-test-review" \
            --result-file "$GITHUB_WORKSPACE/.daily-test/openseek-review.json" \
            "$(cat "$RUNNER_TEMP/daily-test-review.md")"

      - name: Parse OpenSeek review
        id: openseek-result
        if: steps.diff.outputs.needs_review == 'true'
        run: |
          moon run --target native "$RUNNER_TEMP/parse-openseek-result.mbtx"

      - name: Summarize staged review
        if: steps.diff.outputs.needs_review == 'true'
        env:
          REVIEW_BODY: ${{ steps.openseek-result.outputs.comment_body }}
        run: printf '## Daily baseline review\n\n%s\n' "$REVIEW_BODY" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload OpenSeek result
        if: always() && steps.diff.outputs.needs_review == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: daily-openseek-result
          path: .daily-test/openseek-review.json
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Comment on pull request
        if: steps.pr.outputs.pr_number != '' && steps.openseek-result.outputs.has_problem == 'true'
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          COMMENT_BODY: ${{ steps.openseek-result.outputs.comment_body }}
        with:
          github-token: ${{ github.token }}
          script: |
            const issue_number = Number(process.env.PR_NUMBER);
            const body = process.env.COMMENT_BODY.trim();

            if (!issue_number) {
              throw new Error("Missing pull request number");
            }
            if (!body) {
              throw new Error("OpenSeek reported a problem but returned an empty comment body");
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body,
            });

      - name: Upload scoped review inputs
        if: always() && steps.diff.outputs.needs_review == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: daily-tests-review
          path: ${{ runner.temp }}/daily-test-review
          if-no-files-found: error

      - name: Require passing tests and review
        if: always()
        env:
          REVIEW_HAS_PROBLEM: ${{ steps.openseek-result.outputs.has_problem }}
          HAS_BASELINE_CHANGES: ${{ steps.diff.outputs.has_baseline_changes }}
        run: |
          unix_status="$(cat .daily-test/unix-cram-test-status.txt 2>/dev/null || echo 1)"
          windows_status="$(cat .daily-test/windows-cram-test-status.txt 2>/dev/null || echo 1)"

          if [ "$unix_status" != "0" ] || [ "$windows_status" != "0" ]; then
            cat .daily-test/unix-cram-test.log 2>/dev/null || true
            cat .daily-test/windows-cram-test.log 2>/dev/null || true
            exit 1
          fi

          if [ "$HAS_BASELINE_CHANGES" = "true" ] &&
             [ "$REVIEW_HAS_PROBLEM" != "true" ] &&
             [ "$REVIEW_HAS_PROBLEM" != "false" ]; then
            echo "::error::Agent review did not return a valid result."
            exit 1
          fi

          if [ "$REVIEW_HAS_PROBLEM" = "true" ]; then
            echo "::notice::Agent found a problem; leaving the daily PR open for review."
          fi

      - name: Auto-merge reviewed daily pull request
        if: steps.diff.outputs.has_baseline_changes == 'true' && steps.openseek-result.outputs.has_problem == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          test -n "$PR_NUMBER"
          reviewed_head="$(git rev-parse HEAD)"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" | jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg head "$DAILY_BRANCH" \
            --arg base "$BASE_BRANCH" \
            --arg base_sha "$BASE_SHA" \
            --arg head_sha "$reviewed_head" \
            '.state == "open" and .draft == false and
             .head.repo.full_name == $repo and .head.ref == $head and .head.sha == $head_sha and
             .base.repo.full_name == $repo and .base.ref == $base and .base.sha == $base_sha' \
            > /dev/null
          gh pr merge "$PR_NUMBER" --auto --squash --match-head-commit "$reviewed_head"
