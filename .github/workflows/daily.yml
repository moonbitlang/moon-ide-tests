name: Daily Test

on:
  schedule:
    - cron: "0 9 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

concurrency:
  group: daily-test
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  DAILY_BRANCH: daily-test/update-baselines

jobs:
  daily-test:
    name: Unix Baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Prepare daily branch
        run: |
          git fetch --no-tags origin main
          git fetch --no-tags origin "+refs/heads/$DAILY_BRANCH:refs/remotes/origin/$DAILY_BRANCH" || true
          git checkout -B "$DAILY_BRANCH" origin/main
          mkdir -p .daily-test
          printf ".daily-test/\n" >> .git/info/exclude

      - name: Update fixture repos
        run: scripts/update-submodules.sh

      - name: Update MoonBit registry
        run: |
          for attempt in 1 2 3; do
            if moon update; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Test generator
        run: moon -C testgen test --target wasm

      - name: Update generated Unix tests
        run: scripts/update-tests.sh

      - name: Refresh Unix snapshots
        run: |
          mkdir -p .daily-test
          scripts/escape-cram-empty-parens.sh tests/unix
          moon cram update --replace --assume-yes --cram-compat tests/unix \
            > .daily-test/unix-cram-update.log 2>&1
          scripts/escape-cram-empty-parens.sh tests/unix

      - name: Run Unix cram tests
        id: unix-cram
        run: |
          set +e
          moon cram test --cram-compat tests/unix \
            > .daily-test/unix-cram-test.log 2>&1
          status=$?
          set -e
          echo "$status" > .daily-test/unix-cram-test-status.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Collect Unix review inputs
        if: always()
        run: |
          mkdir -p .daily-test
          git submodule status --recursive > .daily-test/submodules.txt
          git status --short > .daily-test/unix-status.txt

      - name: Commit Unix daily changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- fixtures/repos tests/unix; then
            git add fixtures/repos tests/unix
            git commit -m "chore: update daily Unix IDE baselines"
          fi

      - name: Push daily branch
        run: git push --force-with-lease origin "$DAILY_BRANCH"

      - name: Upload Unix review inputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-unix-review-inputs
          path: .daily-test
          if-no-files-found: ignore
          include-hidden-files: true

  windows-baseline:
    name: Windows Baselines
    runs-on: windows-latest
    needs: daily-test
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install MoonBit
        shell: powershell
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prepare daily branch
        shell: powershell
        run: |
          git fetch --no-tags origin main
          $refspec = "+refs/heads/$env:DAILY_BRANCH" + ":refs/remotes/origin/$env:DAILY_BRANCH"
          git fetch --no-tags origin $refspec
          git checkout -B $env:DAILY_BRANCH "origin/$($env:DAILY_BRANCH)"
          New-Item -ItemType Directory -Force -Path .daily-test | Out-Null
          ".daily-test/" | Out-File -FilePath .git\info\exclude -Encoding utf8 -Append

      - name: Update MoonBit registry
        shell: powershell
        run: |
          foreach ($attempt in 1, 2, 3) {
            moon update
            if ($LASTEXITCODE -eq 0) {
              break
            }
            if ($attempt -eq 3) {
              exit 1
            }
            Start-Sleep -Seconds ($attempt * 10)
          }

      - name: Update Windows snapshots
        shell: powershell
        run: .\scripts\update-windows-tests.ps1 -RefreshSnapshots

      - name: Run Windows cram tests
        id: windows-cram
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .daily-test | Out-Null
          cmd.exe /D /C "moon cram test --cram-compat --no-keep-output-crlf --shell scripts\moon-cram-powershell.cmd tests\windows > .daily-test\windows-cram-test.log 2>&1"
          $status = $LASTEXITCODE
          [System.IO.File]::WriteAllText(".daily-test\windows-cram-test-status.txt", [string]$status, [System.Text.Encoding]::ASCII)
          "status=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          exit 0

      - name: Commit Windows daily changes
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage first: the Windows checkout can report CRLF-only worktree
          # changes that disappear once Git normalizes them into the index.
          git -c core.safecrlf=false add --renormalize -- tests/windows
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          git diff --cached --quiet -- tests/windows
          $diffStatus = $LASTEXITCODE

          $windowsStatus = @(git diff --cached --name-status -- tests/windows)
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $windowsStatusText = $windowsStatus -join [Environment]::NewLine
          if ($windowsStatusText.Length -gt 0) {
            $windowsStatusText += [Environment]::NewLine
          }
          [System.IO.File]::WriteAllText(
            ".daily-test\windows-status.txt",
            $windowsStatusText,
            [System.Text.UTF8Encoding]::new($false)
          )

          if ($diffStatus -eq 1) {
            git commit -m "chore: update daily Windows IDE baselines"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
            git push --force-with-lease origin $env:DAILY_BRANCH
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          } elseif ($diffStatus -ne 0) {
            exit $diffStatus
          }

      - name: Upload Windows review inputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-windows-review-inputs
          path: .daily-test
          if-no-files-found: ignore
          include-hidden-files: true

  daily-review:
    name: Daily Review
    runs-on: ubuntu-latest
    needs:
      - daily-test
      - windows-baseline
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update MoonBit registry
        run: |
          for attempt in 1 2 3; do
            if moon update; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Checkout daily branch
        run: |
          git fetch --no-tags origin main
          git fetch --no-tags origin "+refs/heads/$DAILY_BRANCH:refs/remotes/origin/$DAILY_BRANCH"
          git checkout -B "$DAILY_BRANCH" "origin/$DAILY_BRANCH"
          git submodule update --init --recursive

      - name: Download Unix review inputs
        uses: actions/download-artifact@v8
        with:
          name: daily-unix-review-inputs
          path: .daily-test

      - name: Download Windows review inputs
        uses: actions/download-artifact@v8
        with:
          name: daily-windows-review-inputs
          path: .daily-test

      - name: Collect final review inputs
        run: |
          mkdir -p .daily-test
          git status --short > .daily-test/status.txt

      - name: Detect daily diff
        id: diff
        run: |
          if git diff --quiet origin/main...HEAD -- fixtures/repos tests/unix tests/windows; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update pull request
        id: pr
        if: steps.diff.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number="$(gh pr list \
            --head "$DAILY_BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          body="$(printf '%s\n\n%s\n%s\n' \
            "This PR was generated by the Daily Test workflow." \
            "It refreshes fixture submodules, regenerates IDE baseline tests with testgen," \
            "promotes Unix Moon Cram snapshots, and promotes Windows Moon Cram snapshots.")"

          if [ -z "$pr_number" ]; then
            pr_url="$(gh pr create \
              --base main \
              --head "$DAILY_BRANCH" \
              --title "chore: update daily IDE baselines" \
              --body "$body")"
            pr_number="${pr_url##*/}"
          else
            gh pr edit "$pr_number" \
              --title "chore: update daily IDE baselines" \
              --body "$body"
          fi

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Review daily output with OpenSeek
        id: openseek
        if: steps.diff.outputs.has_changes == 'true'
        env:
          DEEPSEEK: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK" ]; then
            echo "::error::Set the DEEPSEEK_API_KEY repository secret to a DeepSeek API key."
            exit 1
          fi

          moonx moonbitlang/openseek@0.6.1 \
            --model deepseek-flash \
            --thinking high \
            --max-steps 120 \
            run \
            --approval never \
            --no-session \
            --dir "$GITHUB_WORKSPACE" \
            --result-file .daily-test/openseek-review.json \
            "$(cat .github/codex/prompts/daily-test-review.md)"

      - name: Parse OpenSeek review
        id: openseek-result
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          moon run --target native .github/scripts/parse-openseek-result.mbtx

      - name: Comment on pull request
        if: steps.diff.outputs.has_changes == 'true' && steps.openseek-result.outputs.has_problem == 'true'
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          COMMENT_BODY: ${{ steps.openseek-result.outputs.comment_body }}
        with:
          github-token: ${{ github.token }}
          script: |
            const issue_number = Number(process.env.PR_NUMBER);
            const body = process.env.COMMENT_BODY.trim();

            if (!issue_number) {
              throw new Error("Missing pull request number");
            }
            if (!body) {
              throw new Error("OpenSeek reported a problem but returned an empty comment body");
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body,
            });

      - name: Fail if cram tests failed without a diff
        if: steps.diff.outputs.has_changes == 'false'
        run: |
          unix_status="$(cat .daily-test/unix-cram-test-status.txt 2>/dev/null || echo 1)"
          windows_status="$(cat .daily-test/windows-cram-test-status.txt 2>/dev/null || echo 1)"

          if [ "$unix_status" != "0" ] || [ "$windows_status" != "0" ]; then
            cat .daily-test/unix-cram-test.log 2>/dev/null || true
            cat .daily-test/windows-cram-test.log 2>/dev/null || true
            exit 1
          fi
